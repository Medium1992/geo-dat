name: Build geodata

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the source has not changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["main.go", "go.mod", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  SOURCE_REPO: MetaCubeX/meta-rules-dat
  SOURCE_BRANCH: sing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_BRANCH" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | grep -oP '(?<=source: )[0-9a-f]{40}' || true)
          if [ "$sha" = "$prev" ] && [ "${{ inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "Source $sha already built, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch rule-set sources
        if: steps.source.outputs.skip != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" sing
          git -C sing sparse-checkout set --no-cone '/geo/**/*.json' '/asn/*.json'
          git -C sing checkout -q "${{ steps.source.outputs.sha }}"

      - name: Build dat files
        if: steps.source.outputs.skip != 'true'
        run: |
          go run . -src sing -out publish
          cd publish
          for f in *.dat; do sha256sum "$f" > "$f.sha256sum"; done
          ls -la

      - name: Publish release
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date -u +%Y%m%d%H%M)
          gh release create "$tag" publish/* --title "$tag" --latest \
            --notes "Built from $SOURCE_REPO@$SOURCE_BRANCH
          source: ${{ steps.source.outputs.sha }}"
          # Keep the 5 newest releases.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' |
            xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Publish release branch
        if: steps.source.outputs.skip != 'true'
        run: |
          cd publish
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build from $SOURCE_REPO@${{ steps.source.outputs.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" release
